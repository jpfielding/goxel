<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>goxel — DICOM volume viewer</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #10161d; color: #dee7ef;
        font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      canvas { display: block; touch-action: none; outline: none; }
      #goxel-status { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
        color: #b8c4d0; }
      #goxel-error { display: none; position: fixed; inset: 0; padding: 2rem; max-width: 46rem; margin: auto;
        height: fit-content; background: #171f28; border: 1px solid #303e4c; border-radius: 6px;
        white-space: pre-wrap; color: #f6978d; }
    </style>
  </head>
  <body>
    <div id="goxel-status">Loading goxel… (about 12 MB)</div>
    <div id="goxel-error" role="alert"></div>
    <noscript>goxel needs JavaScript, WebAssembly and WebGL.</noscript>
    <script src="wasm_exec.js"></script>
    <script>
      (async () => {
        const status = document.getElementById("goxel-status");
        const fail = (why) => {
          status.remove();
          const el = document.getElementById("goxel-error");
          el.textContent = why + "\n\ngoxel's web build needs WebAssembly and WebGL " +
            "(WebGL2 for the GPU volume renderer): a recent Chrome, Edge, Firefox or Safari.";
          el.style.display = "block";
        };
        if (!window.WebAssembly) return fail("This browser does not support WebAssembly.");
        const probe = document.createElement("canvas");
        if (!probe.getContext("webgl") && !probe.getContext("experimental-webgl"))
          return fail("This browser does not expose WebGL.");
        if (!document.createElement("canvas").getContext("webgl2"))
          console.warn("WebGL2 unavailable: the 3D view will use the slow CPU renderer.");
        try {
          const go = new Go();
          const { instance } = await WebAssembly.instantiateStreaming(fetch("goxel.wasm"), go.importObject);
          status.remove();
          await go.run(instance);
        } catch (e) {
          fail("Failed to start goxel: " + e);
        }
      })();
    </script>
  </body>
</html>
